# usage: ansible-playbook -i ansible/inventory.ini ansible/playbooks/chaos/node-kubelet.yml -e node=gpu-lab-worker -e kubelet_action=stop   (or start)
- hosts: host
  tasks:
    - name: "{{ kubelet_action }} kubelet inside {{ node }}"
      ansible.builtin.command: docker exec {{ node }} systemctl {{ kubelet_action }} kubelet
