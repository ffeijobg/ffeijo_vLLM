# usage: ansible-playbook -i ansible/inventory.ini ansible/playbooks/chaos/nfs-toggle.yml -e nfs_action=stop   (or start)
- hosts: nfs
  become: true
  tasks:
    - name: "{{ nfs_action }} nfs-kernel-server"
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: "{{ 'stopped' if nfs_action == 'stop' else 'started' }}"
