## gitops/vllm/gate-hook.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-gate
  namespace: inference
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prober
          image: llm-prober:0.1.1
          imagePullPolicy: IfNotPresent
          args: ["--retries", "2"]
          env:
            - { name: ENDPOINT, value: "http://vllm.inference.svc:8000" }
