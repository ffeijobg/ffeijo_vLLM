apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: vllm, namespace: inference }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true       # abort a stuck update; if your version rejects this, abort by hand
  selector: { matchLabels: { app: vllm } }
  strategy:
    blueGreen:
      activeService: vllm
      previewService: vllm-preview
      autoPromotionEnabled: true     # promote automatically, but only after the gate passes
      scaleDownDelaySeconds: 60
      prePromotionAnalysis:
        templates: [{ templateName: llm-prober-gate }]
        args:
          - { name: endpoint, value: "http://vllm-preview.inference.svc:8000" }
  template:
    # Identical pod template to the Deployment in step 2.6, except:
    #   --gpu-memory-utilization=0.40   (two pods now share the GPU)
    metadata: { labels: { app: vllm } }
    spec:
      runtimeClassName: nvidia
      nodeSelector: { workload: inference }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: vllm
          image: vllm/vllm-openai:<pinned-tag>      # pin a released tag, never latest
          imagePullPolicy: IfNotPresent
          args:
            - --model=/models/qwen2.5-0.5b
            - --served-model-name=lab-model
            - --max-model-len=4096
            - --gpu-memory-utilization=0.80
            - --port=8000
          ports: [{ containerPort: 8000, name: http }]
          resources:
            limits: { nvidia.com/gpu: 1, memory: 12Gi }
            requests: { cpu: "2", memory: 8Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60                      # allows up to 10 minutes to load
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
      volumes:
        - { name: models, hostPath: { path: /models, type: Directory } }   # the node's bind mount of the host export
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: vllm-preview, namespace: inference, labels: { app: vllm-preview } }
spec:
  selector: { app: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
