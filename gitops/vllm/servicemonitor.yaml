# gitops/vllm/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: vllm, namespace: inference, labels: { release: kube-prometheus-stack } }
spec:
  selector: { matchLabels: { app: vllm } }          # matches the Service "vllm" (label app: vllm)
  endpoints: [{ port: http, path: /metrics, interval: 15s }]   # "http" is the Service's port name
